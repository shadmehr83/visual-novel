<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#171a1c"/><title>Stillframe — Visual Novel Studio</title>
<script>
// Studio design (by Claude). The local Stillframe 3 build (data-sf3) opens the Stillframe 3 design on every
// start unless this tab chose the classic one. The hosted studio opens the classic design unless this
// browser chose Stillframe 3 in Settings → Studio design. The light or dark palette is remembered.
try{var d=document.documentElement,local=d.hasAttribute("data-sf3");if(local?sessionStorage.getItem("stillframe3-design")!=="classic":localStorage.getItem("stillframe-design")==="v3")d.setAttribute("data-ui","v3");if(localStorage.getItem("stillframe3-palette")==="dark")d.setAttribute("data-palette","dark");}catch(e){}
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
