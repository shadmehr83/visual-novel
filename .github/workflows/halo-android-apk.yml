                  session.setPlaybackState(new PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY|PlaybackState.ACTION_PAUSE|PlaybackState.ACTION_PLAY_PAUSE|PlaybackState.ACTION_STOP|PlaybackState.ACTION_SEEK_TO)
                      .setState(playing?PlaybackState.STATE_PLAYING:PlaybackState.STATE_PAUSED,pos,playing?1f:0f,SystemClock.elapsedRealtime()).build());
              }
              private PendingIntent actionPending(String action,int code){
