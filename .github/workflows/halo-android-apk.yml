              try{MediaSessionManager m=(MediaSessionManager)c.getSystemService(Context.MEDIA_SESSION_SERVICE);
                List<MediaController> xs=m.getActiveSessions(new ComponentName(c,MainActivity.Listener.class));MediaController best=null;int rank=-1;
                for(MediaController x:xs){if(x.getMetadata()==null)continue;int n=1;
                  PlaybackState p=x.getPlaybackState();if(p!=null&&p.getState()==PlaybackState.STATE_PLAYING)n+=20;
                  if(x.getPackageName().equals("com.google.android.apps.youtube.music"))n+=8;
                  if(n>rank){best=x;rank=n;}}
                return best;
              }catch(Exception e){return null;}
            }
            static PendingIntent click(Context c,String cmd,int code){
              return PendingIntent.getBroadcast(c,code,new Intent(c,HaloMusicWidget.class).setAction(cmd),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
            }
            public static void updateAll(Context c){AppWidgetManager m=AppWidgetManager.getInstance(c);
              int[] ids=m.getAppWidgetIds(new ComponentName(c,HaloMusicWidget.class));if(ids.length>0)update(c,m,ids);}
            static void update(Context c,AppWidgetManager m,int[] ids){MediaController x=current(c);
              MediaMetadata md=x==null?null:x.getMetadata();PlaybackState p=x==null?null:x.getPlaybackState();
              String title=md==null?"Waiting for music":md.getString(MediaMetadata.METADATA_KEY_TITLE);
              String artist=md==null?"Enable music access in HALO":md.getString(MediaMetadata.METADATA_KEY_ARTIST);
              if(title==null)title="Now playing";if(artist==null)artist="Music";
              for(int id:ids){RemoteViews r=new RemoteViews(c.getPackageName(),R.layout.widget_music);
                r.setTextViewText(R.id.wm_title,title);r.setTextViewText(R.id.wm_artist,artist);
                r.setTextViewText(R.id.wm_play,p!=null&&p.getState()==PlaybackState.STATE_PLAYING?"Ⅱ":"▶");
                r.setOnClickPendingIntent(R.id.wm_prev,click(c,"app.halo.music.PREV",133));
                r.setOnClickPendingIntent(R.id.wm_play,click(c,"app.halo.music.TOGGLE",134));
                r.setOnClickPendingIntent(R.id.wm_next,click(c,"app.halo.music.NEXT",135));
                r.setOnClickPendingIntent(R.id.wm_open,PendingIntent.getActivity(c,136,new Intent(c,MainActivity.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE));
                m.updateAppWidget(id,r);
              }
            }
            @Override public void onUpdate(Context c,AppWidgetManager m,int[] ids){update(c,m,ids);}
            @Override public void onReceive(Context c,Intent i){super.onReceive(c,i);
              String a=i.getAction();if(a==null)return;
