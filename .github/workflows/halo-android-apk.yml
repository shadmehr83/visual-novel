                  return PendingIntent.getService(this,code,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              }
              private Notification notification(){
                  PendingIntent show=PendingIntent.getActivity(this,5,new Intent(this,MainActivity.class)
                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP|Intent.FLAG_ACTIVITY_CLEAR_TOP),PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this,CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title).setContentText(artist)
                      .setContentIntent(show).setOngoing(playing).setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .addAction(new Notification.Action.Builder(playing?android.R.drawable.ic_media_pause:android.R.drawable.ic_media_play,
                           playing?"Pause":"Play",actionPending(ACTION_TOGGLE,6)).build())
                      .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel,"Stop",actionPending(ACTION_STOP,7)).build())
                      .setStyle(new Notification.MediaStyle().setMediaSession(session.getSessionToken()).setShowActionsInCompactView(0))
                      .build();
              }
              private void enterForeground(){
                  if(Build.VERSION.SDK_INT>=29)startForeground(NOTIFICATION_ID,notification(),ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(NOTIFICATION_ID,notification());
                  foreground=true;
              }
              private void updateNotification(){
                  if(foreground)((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).notify(NOTIFICATION_ID,notification());
              }
              private void releasePlayer(){
                  if(player!=null){try{player.reset();}catch(Exception ignored){}try{player.release();}catch(Exception ignored){}player=null;}
                  prepared=false;playing=false;
              }
              @Override public void onDestroy(){
                  releasePlayer();
