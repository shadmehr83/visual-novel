                      Uri uri=data.getData();
                      try{getContentResolver().takePersistableUriPermission(uri,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}
                      Intent play=HaloPlaybackService.playIntent(this,uri);
                      if(Build.VERSION.SDK_INT>=26)startForegroundService(play);else startService(play);
                      helpText.setText("Playing local audio in the background. Use notification controls when the screen is locked.");
                      handler.postDelayed(()->{refreshMedia();pushToWeb();},900);
                  }
              }
              private void handleCommand(Uri uri) {
                  String command = uri.getPath() == null ? "" : uri.getPath();
                  if ("/local".equals(command)) {openLocalFile();return;}
                  if ("/weather".equals(command)) {
                      try {
                          String city=uri.getQueryParameter("city");
                          double lat=Double.parseDouble(uri.getQueryParameter("lat"));
                          double lon=Double.parseDouble(uri.getQueryParameter("lon"));
                          HaloWeatherWidget.setLocation(this,city==null?"Melbourne":city,lat,lon);
                      }catch(Exception ignored){}
                      return;
                  }
          if ("/browser".equals(command)) {openInsideMusicBrowser("https://music.youtube.com/");return;}
          if ("/browser-open".equals(command)) {openInsideMusicBrowser(uri.getQueryParameter("url"));return;}
          if ("/browser-auth".equals(command)) {openSecureBrowser(uri.getQueryParameter("url"));return;}
                  if ("/settings".equals(command)) {openNotificationSettings();return;}
                  if ("/audio".equals(command)) {requestAudioPermission();return;}
                  if (controller == null) return;
                  MediaController.TransportControls t = controller.getTransportControls();
                  switch (command) {
                      case "/toggle":
                          PlaybackState s = controller.getPlaybackState();
                          if (s != null && s.getState() == PlaybackState.STATE_PLAYING) t.pause();
                          else t.play();
                          break;
                      case "/play": t.play(); break;
                      case "/pause": t.pause(); break;
                      case "/next": t.skipToNext(); break;
                      case "/previous": t.skipToPrevious(); break;
                      case "/seek":
                          try { t.seekTo(Long.parseLong(uri.getQueryParameter("ms"))); } catch (Exception ignored) { }
                          break;
                      case "/settings": openNotificationSettings(); break;
                      case "/audio": requestAudioPermission(); break;
                  }
                  handler.postDelayed(this::pushToWeb, 300);
              }
          
              private void startAudioVisualizer() {
                  if (!resumed || !audioAllowed() || visualizer != null) return;
                  long now = android.os.SystemClock.elapsedRealtime();
                  if (now - lastAudioAttempt < 7000) return;
                  lastAudioAttempt = now;
                  try {
                      // Android output-mix session 0, if permitted by this device and source.
                      Visualizer v = new Visualizer(0);
                      v.setEnabled(false);
                      v.setCaptureSize(Visualizer.getCaptureSizeRange()[1]);
                      v.setDataCaptureListener(new Visualizer.OnDataCaptureListener() {
                          @Override public void onWaveFormDataCapture(Visualizer v, byte[] wave, int samplingRate) { }
                          @Override public void onFftDataCapture(Visualizer v, byte[] fft, int samplingRate) {
                              if (fft == null || fft.length < 32) return;
                              int n = fft.length / 2;
                              double sample = Math.max(8000, samplingRate / 1000.0);
                              double b=0,m=0,h=0; int nb=0,nm=0,nh=0;
                              for (int i=1;i<n;i++) {
                                  int real = fft[i*2], imag = fft[i*2+1];
                                  double hz = i * sample / fft.length;
                                  double mag = Math.sqrt(real*real + imag*imag);
                                  double energy = Math.min(1, Math.log1p(mag) / 5.4);
                                  if(hz < 240) { b+=energy; nb++; }
                                  else if(hz < 1900) { m+=energy; nm++; }
                                  else if(hz < 9200) { h+=energy; nh++; }
                              }
                              float bb = (float)(b/Math.max(1,nb)), mm=(float)(m/Math.max(1,nm)), hh=(float)(h/Math.max(1,nh));
                              if (bb+mm+hh > .04f) {
                                  bass = bb; mids = mm; highs = hh; measured = true;
                              } else { bass*=.8f; mids*=.8f; highs*=.8f; if(bass+mids+highs<.05f) measured=false; }
                          }
                      }, Math.max(1000, Visualizer.getMaxCaptureRate()/2), false, true);
                      v.setEnabled(true);
                      visualizer = v;
                  } catch (Exception ex) { measured = false; closeVisualizer(); }
              }
              private void closeVisualizer() {
                  if (visualizer != null) {
                      try {visualizer.setEnabled(false);} catch (Exception ignored) { }
                      try {visualizer.release();} catch (Exception ignored) { }
                      visualizer = null;
                  }
                  measured = false;
              }
          
              @Override protected void onResume() {
