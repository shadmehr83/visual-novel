              public static MediaSession.Token getToken(){return currentToken;}
              public static Intent playIntent(Context c, Uri uri) {return new Intent(c,HaloPlaybackService.class).setAction(ACTION_PLAY).setData(uri);}
              public static Intent toggleIntent(Context c){return new Intent(c,HaloPlaybackService.class).setAction(ACTION_TOGGLE);}
              public static Intent stopIntent(Context c){return new Intent(c,HaloPlaybackService.class).setAction(ACTION_STOP);}
              public static Intent seekIntent(Context c,long position){return new Intent(c,HaloPlaybackService.class).setAction(ACTION_SEEK).putExtra("position",position);}
          
              @Override public void onCreate(){
                  super.onCreate();
                  audio=(AudioManager)getSystemService(AUDIO_SERVICE);
                  NotificationChannel ch=new NotificationChannel(CHANNEL,"HALO background music",NotificationManager.IMPORTANCE_LOW);
                  ch.setDescription("Controls for audio opened directly in HALO");
                  ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  session=new MediaSession(this,"HALO Local Player");
                  session.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS|MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  session.setCallback(new MediaSession.Callback(){
                      @Override public void onPlay(){play();}
                      @Override public void onPause(){pause();}
                      @Override public void onStop(){stopSelf();}
                      @Override public void onSeekTo(long pos){seek(pos);}
