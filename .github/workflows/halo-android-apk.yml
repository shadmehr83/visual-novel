           static void load(Context c,AppWidgetManager m,int[] ids){new Thread(()->{
            android.content.SharedPreferences p=c.getSharedPreferences("halo-weather",0);
            String city=p.getString("city","Melbourne"),lat=p.getString("lat","-37.8136"),lon=p.getString("lon","144.9631");
            String temp="--°",icon="☾",desc="Weather unavailable",rain="Rain --";
            try{
             URL u=new URL("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code,is_day,precipitation&hourly=precipitation_probability&forecast_days=1&timezone=auto");
             HttpURLConnection h=(HttpURLConnection)u.openConnection();h.setConnectTimeout(6500);h.setReadTimeout(6500);
             try(InputStream in=h.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
              byte[] buf=new byte[2048];int n;while((n=in.read(buf))>=0)out.write(buf,0,n);
              JSONObject d=new JSONObject(new String(out.toByteArray(),StandardCharsets.UTF_8));
              JSONObject now=d.getJSONObject("current");int code=now.optInt("weather_code",0),day=now.optInt("is_day",1);
              temp=Math.round(now.optDouble("temperature_2m",0))+"°";
              desc=code>=95?"Storm":code>=61?"Rain":code>=51?"Drizzle":code>=45?"Fog":code>=3?"Cloudy":code>=1?"Partly cloudy":"Clear";
              icon=code>=61?"☂":day==1?"☼":"☾";
              JSONObject hh=d.optJSONObject("hourly");if(hh!=null&&hh.optJSONArray("precipitation_probability")!=null)rain="Rain "+hh.getJSONArray("precipitation_probability").optInt(0)+"%";
             }finally{h.disconnect();}
            }catch(Exception ignored){}
            for(int id:ids){
             RemoteViews r=new RemoteViews(c.getPackageName(),R.layout.widget_weather);
             r.setTextViewText(R.id.ww_city,city);r.setTextViewText(R.id.ww_temp,temp);
             r.setTextViewText(R.id.ww_desc,desc);r.setTextViewText(R.id.ww_rain,rain);r.setTextViewText(R.id.ww_icon,icon);
             r.setOnClickPendingIntent(R.id.ww_root,PendingIntent.getActivity(c,177,new Intent(c,MainActivity.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE));
             m.updateAppWidget(id,r);
            }
