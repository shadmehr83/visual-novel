                          .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          .setOnAudioFocusChangeListener(change->{if(change<=AudioManager.AUDIOFOCUS_LOSS_TRANSIENT)pause();})
                          .build();
                      return audio.requestAudioFocus(focusRequest)==AudioManager.AUDIOFOCUS_REQUEST_GRANTED;
                  }
                  return audio.requestAudioFocus(change->{if(change<=AudioManager.AUDIOFOCUS_LOSS_TRANSIENT)pause();},AudioManager.STREAM_MUSIC,AudioManager.AUDIOFOCUS_GAIN)==AudioManager.AUDIOFOCUS_REQUEST_GRANTED;
              }
