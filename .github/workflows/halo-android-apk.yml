                      MediaPlayer p=new MediaPlayer();
                      p.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      p.setWakeMode(getApplicationContext(),PowerManager.PARTIAL_WAKE_LOCK);
                      p.setDataSource(this,uri);
                      player=p;
                      p.setOnPreparedListener(mp->{prepared=true;duration=mp.getDuration();play();});
                      p.setOnCompletionListener(mp->{playing=false;updateSession();updateNotification();});
                      p.setOnErrorListener((mp,what,extra)->{playing=false;prepared=false;updateSession();updateNotification();return true;});
                      p.prepareAsync();
                  }catch(Exception e){
                      title="Could not open audio";artist="Choose another audio file";
                      updateSession();updateNotification();
                      stopSelf();
                  }
              }
              private String findName(Uri uri){
                  try(Cursor c=getContentResolver().query(uri,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null)){
                      if(c!=null&&c.moveToFirst()){String result=c.getString(0);if(result!=null&&!result.isEmpty())return result;}
                  }catch(Exception ignored){}
