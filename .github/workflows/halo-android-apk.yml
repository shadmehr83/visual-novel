          /** Plays user-selected local audio independently of HALO's WebView or Activity. */
          public final class HaloPlaybackService extends Service {
              private static final String CHANNEL="halo_playback", ACTION_PLAY="app.halo.music.PLAY", ACTION_TOGGLE="app.halo.music.TOGGLE", ACTION_STOP="app.halo.music.STOP", ACTION_SEEK="app.halo.music.SEEK";
              private static final int NOTIFICATION_ID=1961;
              private static volatile MediaSession.Token currentToken;
              private MediaPlayer player;
              private MediaSession session;
              private AudioManager audio;
              private AudioFocusRequest focusRequest;
