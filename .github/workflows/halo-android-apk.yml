      - name: Install Android SDK
        run: |
          SDKMGR=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: HALO-Android-8.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
