name: Build HALO Android v8
on:
  push:
    branches: [halo-android-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Write HALO Android sources
        shell: bash
        run: |
          set -eu
          cat > 'settings.gradle' <<'HALO_FILE_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='HALOAndroid'
          include ':app'
          HALO_FILE_END
          echo 'android.useAndroidX=true' > gradle.properties
          cat > 'build.gradle' <<'HALO_FILE_END'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          HALO_FILE_END
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'HALO_FILE_END'
          plugins { id 'com.android.application' }
          android { namespace 'app.halo.music'; compileSdk 35; defaultConfig { applicationId 'app.halo.music'; minSdk 26; targetSdk 35; versionCode 8; versionName '8.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          dependencies { implementation 'androidx.browser:browser:1.8.0' }
          HALO_FILE_END
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'HALO_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:allowBackup="false" android:label="HALO Music" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".MainActivity$Listener" android:label="HALO music detection" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
                  <receiver android:name=".HaloMusicWidget" android:exported="true">
                    <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                    <meta-data android:name="android.appwidget.provider" android:resource="@xml/music_widget_info"/>
                  </receiver>
                  <receiver android:name=".HaloWeatherWidget" android:exported="true">
                    <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                    <meta-data android:name="android.appwidget.provider" android:resource="@xml/weather_widget_info"/>
                  </receiver>
                  <service android:name=".HaloPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" android:stopWithTask="false"/>
              </application>
          </manifest>
          HALO_FILE_END
          mkdir -p 'app/src/main/java/app/halo/music'
          cat > 'app/src/main/java/app/halo/music/MainActivity.java' <<'HALO_FILE_END'
          package app.halo.music;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.Service;
          import android.service.notification.NotificationListenerService;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import androidx.browser.customtabs.CustomTabsIntent;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import android.media.MediaMetadata;
          import android.media.audiofx.Visualizer;
          import android.media.session.MediaController;
          import android.media.session.MediaSession;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONObject;
          import java.util.List;
          import java.util.Locale;
          
          /**
           * HALO Android: reads Android's active MediaSession after explicit user permission.
           * The page is the public HALO interface; metadata is pushed only to the local WebView.
           * Playback commands come only from main-frame halo://control URLs.
           */
          public final class MainActivity extends Activity {
              // Keep the same notification listener component as the first installed HALO version.
              public static final class Listener extends NotificationListenerService {
                  @Override public void onListenerConnected(){super.onListenerConnected();HaloMusicWidget.updateAll(this);}
                  @Override public void onNotificationPosted(android.service.notification.StatusBarNotification sbn){HaloMusicWidget.updateAll(this);}
              }
              private static final int LOCAL_FILE_PICK = 73;
              private static final String SITE = "https://halo-atmosphere.shadmehr-testing-ground.workers.dev/";
              private static final String YOUTUBE_MUSIC = "com.google.android.apps.youtube.music";
              private static final int AUDIO_PERMISSION_REQUEST = 49;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private WebView web;
              private LinearLayout musicBrowserPanel;
              private android.widget.FrameLayout musicBrowserHolder;
              private android.widget.EditText musicBrowserAddress;
              private android.widget.TextView musicBrowserCount;
              private final java.util.ArrayList<WebView> musicBrowserTabs = new java.util.ArrayList<>();
              private int musicBrowserActive=-1;
              private TextView helpText;
              private Button enableMedia;
              private Button enableEffects;
              private Button localFile;
          private Button musicBrowser;
          private String artKey="",artValue="";
          private long lastArtAttempt=0;
              private boolean pageReady = false;
              private boolean resumed = false;
              private MediaSessionManager sessions;
              private ComponentName listener;
              private MediaController controller;
              private Visualizer visualizer;
              private volatile float bass = 0, mids = 0, highs = 0;
              private volatile boolean measured = false;
              private long lastSessionRefresh = 0;
              private long lastAudioAttempt = 0;
              private final Runnable refresh = new Runnable() {
                  @Override public void run() {
                      if (!resumed) return;
                      try { refreshMedia(); pushToWeb(); } catch (Exception ignored) { }
                      handler.postDelayed(this, 650);
                  }
              };
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(8, 12, 20));
                  getWindow().setNavigationBarColor(Color.rgb(8, 12, 20));
                  sessions = (MediaSessionManager) getSystemService(MEDIA_SESSION_SERVICE);
                  listener = new ComponentName(this, Listener.class);
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 12, 20));
                  helpText = new TextView(this);
                  helpText.setTextColor(Color.rgb(225, 221, 255));
                  helpText.setTextSize(12);
                  helpText.setPadding(dp(15), dp(9), dp(15), dp(7));
                  helpText.setText("HALO · Connect your YouTube Music session");
                  root.addView(helpText, new LinearLayout.LayoutParams(-1, -2));
          
                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setGravity(Gravity.CENTER_VERTICAL);
                  buttons.setPadding(dp(10), 0, dp(10), dp(7));
                  enableMedia = new Button(this);
                  enableMedia.setText("Enable music access");
                  enableMedia.setAllCaps(false);
                  enableMedia.setOnClickListener(v -> openNotificationSettings());
                  buttons.addView(enableMedia, new LinearLayout.LayoutParams(0, dp(45), 1));
                  enableEffects = new Button(this);
                  enableEffects.setText("Enable audio pulse");
                  enableEffects.setAllCaps(false);
                  enableEffects.setOnClickListener(v -> requestAudioPermission());
                  LinearLayout.LayoutParams audioParams = new LinearLayout.LayoutParams(0, dp(45), 1);
                  audioParams.leftMargin = dp(6);
                  buttons.addView(enableEffects, audioParams);
                  root.addView(buttons, new LinearLayout.LayoutParams(-1, -2));
                  localFile = new Button(this);
                  localFile.setText("Play a file in background  ·  screen-off supported");
                  localFile.setAllCaps(false);
                  localFile.setOnClickListener(v -> openLocalFile());
                  LinearLayout.LayoutParams fileParams=new LinearLayout.LayoutParams(-1,dp(44));
                  fileParams.setMargins(dp(10),0,dp(10),dp(5));
                  root.addView(localFile,fileParams);
          musicBrowser=new Button(this);
          musicBrowser.setText("Open music browser inside HALO");
          musicBrowser.setAllCaps(false);
          musicBrowser.setOnClickListener(v->openInsideMusicBrowser("https://music.youtube.com/"));
          LinearLayout.LayoutParams browserParams=new LinearLayout.LayoutParams(-1,dp(44));
          browserParams.setMargins(dp(10),0,dp(10),dp(5));
          root.addView(musicBrowser,browserParams);
          
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(8, 12, 20));
                  WebSettings opts = web.getSettings();
                  opts.setJavaScriptEnabled(true);
                  opts.setDomStorageEnabled(true);
                  opts.setAllowFileAccess(false);
                  opts.setAllowContentAccess(false);
                  opts.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  opts.setMediaPlaybackRequiresUserGesture(true);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if ("halo".equalsIgnoreCase(u.getScheme())) {
                              if (req.isForMainFrame() && "control".equals(u.getHost())) handleCommand(u);
                              return true;
                          }
                          if ("https".equalsIgnoreCase(u.getScheme()) &&
                              "halo-atmosphere.shadmehr-testing-ground.workers.dev".equalsIgnoreCase(u.getHost())) return false;
                          if (req.isForMainFrame()) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                              return true;
                          }
                          return false;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          pageReady = url.startsWith(SITE);
                          if (pageReady) {
                              web.evaluateJavascript("window.haloNativeReady && window.haloNativeReady()", null);
                              pushToWeb();
                          }
                      }
                  });
                  root.addView(web, new LinearLayout.LayoutParams(-1, 0, 1));
                  musicBrowserPanel = new LinearLayout(this);
                  musicBrowserPanel.setOrientation(LinearLayout.VERTICAL);
                  musicBrowserPanel.setBackgroundColor(Color.rgb(11,15,25));
                  LinearLayout browserTools = new LinearLayout(this);
                  browserTools.setGravity(Gravity.CENTER_VERTICAL);
                  browserTools.setPadding(dp(5),dp(4),dp(5),dp(4));
                  Button returnHalo=new Button(this);returnHalo.setAllCaps(false);returnHalo.setText("HALO");
                  returnHalo.setOnClickListener(v->closeMusicBrowserView());
                  browserTools.addView(returnHalo,new LinearLayout.LayoutParams(dp(67),dp(45)));
                  Button browserBack=new Button(this);browserBack.setAllCaps(false);browserBack.setText("‹");
                  browserBack.setOnClickListener(v->{WebView b=activeMusicBrowser();if(b!=null&&b.canGoBack())b.goBack();});
                  browserTools.addView(browserBack,new LinearLayout.LayoutParams(dp(46),dp(45)));
                  musicBrowserAddress=new android.widget.EditText(this);
                  musicBrowserAddress.setSingleLine(true);
                  musicBrowserAddress.setInputType(android.text.InputType.TYPE_CLASS_TEXT|android.text.InputType.TYPE_TEXT_VARIATION_URI);
                  musicBrowserAddress.setTextColor(Color.WHITE);
                  musicBrowserAddress.setTextSize(12);
                  musicBrowserAddress.setHint("https://music.youtube.com");
                  musicBrowserAddress.setHintTextColor(Color.rgb(140,151,169));
                  musicBrowserAddress.setOnEditorActionListener((field,action,event)->{
                      String entered=field.getText().toString().trim();
                      if(!entered.contains("://"))entered="https://"+entered;
                      try{Uri u=Uri.parse(entered);if(!"https".equalsIgnoreCase(u.getScheme()))return true;WebView b=activeMusicBrowser();if(b!=null)b.loadUrl(u.toString());}catch(Exception ignored){}
                      return true;
                  });
                  browserTools.addView(musicBrowserAddress,new LinearLayout.LayoutParams(0,dp(45),1));
                  Button go=new Button(this);go.setText("→");go.setAllCaps(false);
                  go.setOnClickListener(v->{
                     String entered=musicBrowserAddress.getText().toString().trim();
                     if(!entered.contains("://"))entered="https://"+entered;
                     try{Uri u=Uri.parse(entered);if("https".equalsIgnoreCase(u.getScheme())){WebView b=activeMusicBrowser();if(b!=null)b.loadUrl(entered);}}catch(Exception ignored){}
                  });
                  browserTools.addView(go,new LinearLayout.LayoutParams(dp(46),dp(45)));
                  musicBrowserPanel.addView(browserTools,new LinearLayout.LayoutParams(-1,dp(55)));
                  LinearLayout extraTools=new LinearLayout(this);
                  extraTools.setPadding(dp(8),0,dp(8),dp(5));
                  musicBrowserCount=new android.widget.TextView(this);
                  musicBrowserCount.setTextColor(Color.rgb(205,213,229));
                  musicBrowserCount.setGravity(Gravity.CENTER_VERTICAL);
                  musicBrowserCount.setTextSize(11);
                  extraTools.addView(musicBrowserCount,new LinearLayout.LayoutParams(0,dp(40),1));
                  Button switchTab=new Button(this);switchTab.setText("Tabs");switchTab.setAllCaps(false);
                  switchTab.setOnClickListener(v->{if(!musicBrowserTabs.isEmpty())showMusicBrowserTab((musicBrowserActive+1)%musicBrowserTabs.size());});
                  extraTools.addView(switchTab,new LinearLayout.LayoutParams(dp(72),dp(40)));
                  Button addTab=new Button(this);addTab.setText("+");addTab.setAllCaps(false);
                  addTab.setOnClickListener(v->openInsideMusicBrowser("https://music.youtube.com/"));
                  extraTools.addView(addTab,new LinearLayout.LayoutParams(dp(46),dp(40)));
                  Button closeTab=new Button(this);closeTab.setText("×");closeTab.setAllCaps(false);
                  closeTab.setOnClickListener(v->removeMusicBrowserTab());
                  extraTools.addView(closeTab,new LinearLayout.LayoutParams(dp(46),dp(40)));
                  Button secure=new Button(this);secure.setText("Sign in");secure.setAllCaps(false);
                  secure.setOnClickListener(v->openSecureBrowser(activeMusicBrowser()==null?"https://music.youtube.com/":activeMusicBrowser().getUrl()));
                  extraTools.addView(secure,new LinearLayout.LayoutParams(dp(79),dp(40)));
                  musicBrowserPanel.addView(extraTools,new LinearLayout.LayoutParams(-1,dp(49)));
                  musicBrowserHolder=new android.widget.FrameLayout(this);
                  musicBrowserPanel.addView(musicBrowserHolder,new LinearLayout.LayoutParams(-1,0,1));
                  root.addView(musicBrowserPanel,new LinearLayout.LayoutParams(-1,0,1));
                  musicBrowserPanel.setVisibility(View.GONE);
                  if (Build.VERSION.SDK_INT >= 30) {
                      root.setOnApplyWindowInsetsListener((view,insets)->{
                          android.graphics.Insets bars=insets.getInsets(android.view.WindowInsets.Type.statusBars()|android.view.WindowInsets.Type.navigationBars());
                          view.setPadding(0,bars.top,0,bars.bottom);
                          return insets;
                      });
                  }
                  setContentView(root);
                  web.loadUrl(SITE);
                  refreshButtons();
              }
          
              private int dp(int n) { return Math.round(getResources().getDisplayMetrics().density * n); }
          
              private boolean hasListener() {
                  String list = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  return list != null && list.contains(getPackageName());
              }
              private boolean audioAllowed() {
                  return Build.VERSION.SDK_INT < 23 || checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
              }
              private void refreshButtons() {
                  boolean granted = hasListener();
                  enableMedia.setText(granted ? "Music access ✓" : "Enable music access");
                  enableMedia.setEnabled(!granted);
                  enableEffects.setText(audioAllowed() ? "Audio permission ✓" : "Enable audio pulse");
                  enableEffects.setEnabled(!audioAllowed());
                  helpText.setText(!granted ? "One-time setup: allow HALO notification access to detect YouTube Music." :
                      "HALO is linked to Android media controls" + (measured ? " · live audio frequencies" : " · visual animation"));
              }
              private WebView activeMusicBrowser(){
                 return musicBrowserActive>=0&&musicBrowserActive<musicBrowserTabs.size()?musicBrowserTabs.get(musicBrowserActive):null;
              }
              private void showMusicBrowserTab(int index){
                 if(index<0||index>=musicBrowserTabs.size())return;
                 musicBrowserActive=index;
                 for(int i=0;i<musicBrowserTabs.size();i++)musicBrowserTabs.get(i).setVisibility(i==index?View.VISIBLE:View.GONE);
                 WebView chosen=activeMusicBrowser();
                 musicBrowserAddress.setText(chosen==null?"":chosen.getUrl());
                 musicBrowserCount.setText("Tab "+(index+1)+"/"+musicBrowserTabs.size());
                 musicBrowserPanel.setVisibility(View.VISIBLE);
                 web.setVisibility(View.GONE);
              }
              private void openInsideMusicBrowser(String address){
                 try{
                    Uri uri=Uri.parse(address==null?"https://music.youtube.com/":address);
                    if(!"https".equalsIgnoreCase(uri.getScheme()))return;
                    WebView browser=new WebView(this);
                    WebSettings settings=browser.getSettings();
                    settings.setJavaScriptEnabled(true);
                    settings.setDomStorageEnabled(true);
                    settings.setAllowFileAccess(false);
                    settings.setAllowContentAccess(false);
                    settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                    settings.setMediaPlaybackRequiresUserGesture(true);
                    browser.setBackgroundColor(Color.rgb(9,13,22));
                    browser.setWebChromeClient(new WebChromeClient());
                    browser.setWebViewClient(new WebViewClient(){
                        @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req){
                            String scheme=req.getUrl().getScheme();
                            if("http".equalsIgnoreCase(scheme)||"https".equalsIgnoreCase(scheme))return false;
                            return true;
                        }
                        @Override public void onPageFinished(WebView view,String url){
                            if(view==activeMusicBrowser())musicBrowserAddress.setText(url);
                        }
                    });
                    musicBrowserTabs.add(browser);
                    musicBrowserHolder.addView(browser,new android.widget.FrameLayout.LayoutParams(-1,-1));
                    showMusicBrowserTab(musicBrowserTabs.size()-1);
                    browser.loadUrl(uri.toString());
                 }catch(Exception ignored){}
              }
              private void closeMusicBrowserView(){
                 musicBrowserPanel.setVisibility(View.GONE);
                 web.setVisibility(View.VISIBLE);
                 pageReady=false;
                 web.evaluateJavascript("window.haloNativeReady && window.haloNativeReady()",null);
                 pageReady=true;pushToWeb();
              }
              private void removeMusicBrowserTab(){
                 WebView browser=activeMusicBrowser();
                 if(browser==null){closeMusicBrowserView();return;}
                 musicBrowserHolder.removeView(browser);
                 musicBrowserTabs.remove(musicBrowserActive);
                 browser.stopLoading();browser.destroy();
                 if(musicBrowserTabs.size()==0){musicBrowserActive=-1;closeMusicBrowserView();}
                 else showMusicBrowserTab(Math.min(musicBrowserActive,musicBrowserTabs.size()-1));
              }
              private void openSecureBrowser(String url){
                 try{
                     Uri u=Uri.parse(url==null?"https://music.youtube.com/":url);
                     if(!"https".equalsIgnoreCase(u.getScheme()))return;
                     new CustomTabsIntent.Builder().setShowTitle(true).setInitialActivityHeightPx(dp(610)).build().launchUrl(this,u);
                 }catch(Exception e){try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://music.youtube.com/")));}catch(Exception ignored){}}
              }
          private void openNotificationSettings() {
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          Intent i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_DETAIL_SETTINGS);
                          i.putExtra(Settings.EXTRA_NOTIFICATION_LISTENER_COMPONENT_NAME, listener.flattenToString());
                          startActivity(i);
                      } else startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
                  } catch (Exception e) { startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)); }
              }
              private void requestAudioPermission() {
                  if (Build.VERSION.SDK_INT >= 23 && !audioAllowed()) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION_REQUEST);
                  } else startAudioVisualizer();
              }
              @Override public void onRequestPermissionsResult(int code, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(code, permissions, results);
                  if (code == AUDIO_PERMISSION_REQUEST && audioAllowed()) startAudioVisualizer();
                  refreshButtons();
              }
          
              private void refreshMedia() {
                  boolean access = hasListener();
                  refreshButtons();
                  if (!access && HaloPlaybackService.getToken()==null) { controller = null; return; }
                  long now = android.os.SystemClock.elapsedRealtime();
                  if (now - lastSessionRefresh < 1100 && controller != null) return;
                  lastSessionRefresh = now;
                  try {
                      List<MediaController> available = access ? sessions.getActiveSessions(listener) : new java.util.ArrayList<>();
                      MediaSession.Token localToken=HaloPlaybackService.getToken();
                      if(localToken!=null) {
                          boolean found=false;
                          for(MediaController c:available) if(c.getPackageName().equals(getPackageName()))found=true;
                          if(!found)available.add(new MediaController(this,localToken));
                      }
                      MediaController preferred = null;
                      int best = -1;
                      for (MediaController c : available) {
                          MediaMetadata m = c.getMetadata();
                          if (m == null) continue;
                          int score = 1;
                          PlaybackState ps = c.getPlaybackState();
                          boolean active=ps!=null&&ps.getState()==PlaybackState.STATE_PLAYING;
                          if (YOUTUBE_MUSIC.equals(c.getPackageName())) score += active?12:2;
                          else if ("com.google.android.youtube".equals(c.getPackageName())) score += active?7:1;
                          else if (getPackageName().equals(c.getPackageName())) score+=active?13:2;
                          if(active)score+=20;
                          if (score > best) { preferred = c; best = score; }
                      }
                      controller = preferred;
                  } catch (SecurityException se) { controller = null; }
              }
          
              private void updateArt(MediaMetadata m,String key){
              long now=android.os.SystemClock.elapsedRealtime();
              if(key.equals(artKey)&&(!artValue.isEmpty()||now-lastArtAttempt<6000))return;
              lastArtAttempt=now;artKey=key;artValue="";
              if(m==null)return;
              try{
                  Bitmap b=m.getDescription()==null?null:m.getDescription().getIconBitmap();
                  if(b==null)b=m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                  if(b==null)b=m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
                  if(b==null)b=m.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON);
                  Uri uri=m.getDescription()==null?null:m.getDescription().getIconUri();
                  if(uri==null){String u=m.getString(MediaMetadata.METADATA_KEY_ART_URI);if(u==null)u=m.getString(MediaMetadata.METADATA_KEY_ALBUM_ART_URI);if(u!=null)uri=Uri.parse(u);}
                  if(b==null&&uri!=null&&("content".equals(uri.getScheme())||"android.resource".equals(uri.getScheme())))
                    try(InputStream input=getContentResolver().openInputStream(uri)){if(input!=null)b=BitmapFactory.decodeStream(input);}
                  if(b!=null&&b.getWidth()>0&&b.getHeight()>0){
                      double k=Math.min(1.,Math.min(320./b.getWidth(),320./b.getHeight()));
                      Bitmap sm=k<1?Bitmap.createScaledBitmap(b,Math.max(1,(int)(b.getWidth()*k)),Math.max(1,(int)(b.getHeight()*k)),true):b;
                      ByteArrayOutputStream out=new ByteArrayOutputStream();if(sm.compress(Bitmap.CompressFormat.JPEG,78,out))artValue="data:image/jpeg;base64,"+Base64.encodeToString(out.toByteArray(),Base64.NO_WRAP);
                      if(sm!=b)sm.recycle();
                  }else if(uri!=null&&"https".equalsIgnoreCase(uri.getScheme()))artValue=uri.toString();
              }catch(Exception ignored){}
          }
          private void pushToWeb() {
                  if (web == null || !pageReady) return;
                  JSONObject obj = new JSONObject();
                  try {
                      obj.put("authorized", hasListener());
                      obj.put("active", controller != null);
                      if (controller != null) {
                          MediaMetadata m = controller.getMetadata();
                          PlaybackState s = controller.getPlaybackState();
                          obj.put("package", controller.getPackageName());
                          obj.put("title", m == null ? "" : String.valueOf(m.getDescription().getTitle() == null ? "" : m.getDescription().getTitle()));
                          obj.put("artist", m == null ? "" : String.valueOf(m.getDescription().getSubtitle() == null ? "" : m.getDescription().getSubtitle()));
                          obj.put("duration", m == null ? 0 : m.getLong(MediaMetadata.METADATA_KEY_DURATION));
          updateArt(m,controller.getPackageName()+"|"+obj.optString("title")+"|"+obj.optString("artist"));
          if(artValue.startsWith("data:image/"))obj.put("artwork",artValue);
          else if(artValue.startsWith("https://"))obj.put("artworkUrl",artValue);
                          if (s != null) {
